name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Project minimum (macOS release builds need 6.9.3, see build_releases.yml).
  # Building CI against the floor enforces the README's "Qt 6.8.0 or newer".
  QT_VERSION: '6.8.3'

jobs:
  # Static QML lint. .qmllint.ini (repo root) disables the categories this
  # architecture can never satisfy (context properties, C++-registered
  # Unabara.* types); everything else gates at zero warnings.
  qmllint:
    name: QML lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.1.1
      with:
        version: ${{ env.QT_VERSION }}
        cache: true

    - name: Run qmllint
      run: qmllint --max-warnings 0 src/ui/qml/*.qml

  build-and-test:
    name: Build & unit tests (Linux, Qt 6.8)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.1.1
      with:
        version: ${{ env.QT_VERSION }}
        modules: 'qtmultimedia'
        cache: true

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUNABARA_BUILD_TESTS=ON

    - name: Build (app + tests)
      run: cmake --build build -j"$(nproc)"

    - name: Run unit tests
      working-directory: build
      run: ctest --output-on-failure

    # The golden-render test writes the hashes it computed for this runner's
    # Qt. Until tests/golden/renders.sha256 has a section for the CI Qt, the
    # test is advisory — download this artifact and commit its contents into
    # the manifest to turn on enforcement (see tests/golden/golden_renders.py).
    - name: Upload computed golden-render hashes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: golden-renders-qt-${{ env.QT_VERSION }}
        path: build/tests/golden_renders/renders.candidate.sha256
        if-no-files-found: ignore

    # Debug aid: on a golden failure the hashes alone can't show WHAT
    # changed — upload the rendered PNGs so they can be pixel-diffed against
    # a local render.
    - name: Upload golden-render PNGs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: golden-renders-pngs-qt-${{ env.QT_VERSION }}
        path: build/tests/golden_renders/*.png
        if-no-files-found: ignore
