name: Build Releases

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger for testing

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.9.3'
  APP_ID: 'org.unabara.unabara'

permissions:
  contents: write

jobs:
  # Read version from the version file.
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from VERSION file
        id: get-version
        run: |
          if [ -f "VERSION.md" ]; then
            VERSION=$(cat VERSION.md | tr -d '\n' | tr -d '\r')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Found version: $VERSION"
          else
            echo "VERSION file not found, using default version"
            echo "version=0.1-dev" >> $GITHUB_OUTPUT
          fi
  build-linux-flatpak:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y flatpak flatpak-builder elfutils
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install -y flathub org.kde.Sdk//6.8
        sudo flatpak install -y org.kde.Platform//6.8

    # The manifest lives in packaging/flatpak/ (also the Flathub submission
    # source). Besides the app it builds the FFmpeg CLI (+ x264/x265/libvpx),
    # so cache flatpak-builder's state dir: the codec modules come before the
    # app module and are only rebuilt when the manifest changes.
    - name: Restore flatpak-builder cache
      uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: flatpak-builder-${{ runner.os }}-${{ hashFiles('packaging/flatpak/**') }}
        restore-keys: |
          flatpak-builder-${{ runner.os }}-

    - name: Build Flatpak
      run: |
        flatpak-builder --repo=repo --force-clean build-dir packaging/flatpak/org.unabara.unabara.yml
        flatpak build-bundle repo ${{ env.APP_ID }}_${{ needs.determine-version.outputs.version }}.flatpak ${{ env.APP_ID }}

    - name: Verify bundled FFmpeg
      shell: bash
      run: |
        test -x build-dir/files/bin/ffmpeg
        test -x build-dir/files/bin/ffprobe
        encoders=$(flatpak-builder --run build-dir packaging/flatpak/org.unabara.unabara.yml ffmpeg -hide_banner -encoders)
        for enc in libx264 libx265 libvpx-vp9 prores_ks; do
          if ! grep -q " $enc " <<< "$encoders"; then
            echo "Bundled ffmpeg is missing encoder: $enc"
            exit 1
          fi
        done
        echo "Bundled ffmpeg OK (libx264, libx265, libvpx-vp9, prores_ks)"

    - name: Upload Linux Flatpak Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unabara-linux-flatpak-${{ needs.determine-version.outputs.version }}
        path: ${{ env.APP_ID }}_${{ needs.determine-version.outputs.version }}.flatpak

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ env.APP_ID }}_${{ needs.determine-version.outputs.version }}.flatpak
        asset_name: unabara-linux-${{ needs.determine-version.outputs.version }}.flatpak
        tag: ${{ github.ref }}
        overwrite: true

  build-windows:
    needs: determine-version
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.1.1
      with:
        aqtversion: '==3.1.*'
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtmultimedia'

    - name: Install MSBuild
      run: choco install visualstudio2022buildtools --package-parameters "--add Microsoft.Component.MSBuild"

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '14.36'
        msbuild-architecture: x64

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --verbose

    - name: Package with windeployqt
      working-directory: ${{github.workspace}}/build
      run: |
        mkdir package
        if (Test-Path bin\${{env.BUILD_TYPE}}\unabara.exe) {
          copy bin\${{env.BUILD_TYPE}}\unabara.exe package\
        } elseif (Test-Path bin\unabara.exe) {
          copy bin\unabara.exe package\
        } else {
          Get-ChildItem -Recurse bin
          throw "Could not find unabara.exe in expected locations"
        }
        cd package
        $env:PATH = "$env:Qt6_DIR\bin;$env:PATH"
        windeployqt unabara.exe --release --no-translations --qmldir=../../src/ui/qml
        cd ..
        mv package unabara-windows-${{ needs.determine-version.outputs.version }}

    # Pinned FFmpeg build (see packaging/ffmpeg-bundle.env). Only KEY=value
    # lines are loaded; $GITHUB_ENV rejects the comment lines.
    - name: Load FFmpeg bundle pins
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' packaging/ffmpeg-bundle.env >> "$GITHUB_ENV"

    # Static GPL build: ffmpeg.exe/ffprobe.exe are self-contained, so nothing
    # can clash with the FFmpeg DLLs windeployqt ships for Qt Multimedia.
    # They sit next to unabara.exe, where app-dir discovery finds them.
    - name: Bundle FFmpeg
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        curl -fsSL --retry 3 -o ffmpeg-bundle.zip "$FFMPEG_WIN_URL"
        echo "$FFMPEG_WIN_SHA256  ffmpeg-bundle.zip" | sha256sum -c -
        7z x -offmpeg-bundle ffmpeg-bundle.zip
        src="ffmpeg-bundle/${FFMPEG_WIN_ASSET%.zip}"
        dest="unabara-windows-${{ needs.determine-version.outputs.version }}"
        cp "$src/bin/ffmpeg.exe" "$src/bin/ffprobe.exe" "$dest/"
        cp "$src/LICENSE.txt" "$dest/ffmpeg-LICENSE.txt"
        rm -rf ffmpeg-bundle ffmpeg-bundle.zip
        test -f "$dest/ffmpeg.exe"
        test -f "$dest/ffprobe.exe"
        test -f "$dest/ffmpeg-LICENSE.txt"
        version_out=$("$dest/ffmpeg.exe" -hide_banner -version)
        echo "${version_out%%$'\n'*}"

    - name: Create ZIP Archive
      working-directory: ${{github.workspace}}/build
      run: |
        7z a -tzip unabara-windows-${{ needs.determine-version.outputs.version }}.zip ./unabara-windows-${{ needs.determine-version.outputs.version }}/*

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unabara-windows-${{ needs.determine-version.outputs.version }}
        path: ${{github.workspace}}/build/unabara-windows-${{ needs.determine-version.outputs.version }}

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{github.workspace}}/build/unabara-windows-${{ needs.determine-version.outputs.version }}.zip
        asset_name: unabara-windows-${{ needs.determine-version.outputs.version }}.zip
        tag: ${{ github.ref }}
        overwrite: true

  build-macos:
    needs: determine-version
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4.1.1
      with:
        aqtversion: '==3.1.*'
        version: ${{ env.QT_VERSION }}
        host: mac
        target: desktop
        arch: clang_64
        modules: qtmultimedia

    - name: Configure CMake for Intel Build
      run: cmake -B ${{github.workspace}}/build-x86_64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=x86_64

    - name: Build Intel Version
      run: cmake --build ${{github.workspace}}/build-x86_64 --config ${{env.BUILD_TYPE}}

    - name: Configure CMake for ARM Build
      run: cmake -B ${{github.workspace}}/build-arm64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_OSX_ARCHITECTURES=arm64

    - name: Build ARM Version
      run: cmake --build ${{github.workspace}}/build-arm64 --config ${{env.BUILD_TYPE}}

    - name: Create Universal Binary and App Bundle
      run: |
        mkdir -p ${{github.workspace}}/build-universal/bin/unabara.app/Contents/MacOS
        mkdir -p ${{github.workspace}}/build-universal/bin/unabara.app/Contents/Resources
        lipo -create \
          ${{github.workspace}}/build-x86_64/bin/unabara.app/Contents/MacOS/unabara \
          ${{github.workspace}}/build-arm64/bin/unabara.app/Contents/MacOS/unabara \
          -output ${{github.workspace}}/build-universal/bin/unabara.app/Contents/MacOS/unabara

        chmod +x ${{github.workspace}}/build-universal/bin/unabara.app/Contents/MacOS/unabara

        # Copy application icon into bundle
        cp ${{github.workspace}}/resources/images/unabara.icns \
           ${{github.workspace}}/build-universal/bin/unabara.app/Contents/Resources/

        # Create Info.plist in the correct app bundle location
        cat > ${{github.workspace}}/build-universal/bin/unabara.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleExecutable</key>
          <string>unabara</string>
          <key>CFBundleIconFile</key>
          <string>unabara.icns</string>
          <key>CFBundleIdentifier</key>
          <string>org.unabara.unabara</string>
          <key>CFBundleName</key>
          <string>Unabara</string>
          <key>CFBundleDisplayName</key>
          <string>Unabara</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleSignature</key>
          <string></string>
          <key>CFBundleShortVersionString</key>
          <string>${{ needs.determine-version.outputs.version }}</string>
          <key>CFBundleVersion</key>
          <string>1</string>
          <key>LSMinimumSystemVersion</key>
          <string>12.0</string>
          <key>NSPrincipalClass</key>
          <string>NSApplication</string>
          <key>NSHighResolutionCapable</key>
          <true/>
          <key>LSArchitecturePriority</key>
          <array>
            <string>arm64</string>
            <string>x86_64</string>
          </array>
        </dict>
        </plist>
        EOF

    # Pinned FFmpeg builds (see packaging/ffmpeg-bundle.env). Only KEY=value
    # lines are loaded; $GITHUB_ENV rejects the comment lines.
    - name: Load FFmpeg bundle pins
      run: grep -E '^[A-Z0-9_]+=' packaging/ffmpeg-bundle.env >> "$GITHUB_ENV"

    # Static builds for both arches, merged into universal binaries and placed
    # in Contents/MacOS BEFORE macdeployqt -dmg so they land in the DMG. They
    # link only system dylibs, so macdeployqt has nothing to rewrite (and must
    # not: install_name_tool would invalidate the publisher's per-slice
    # signatures, which lipo preserves). The job is unsigned today.
    - name: Bundle FFmpeg (universal)
      run: |
        APP=${{github.workspace}}/build-universal/bin/unabara.app
        WORK=${{github.workspace}}/ffmpeg-bundle
        mkdir -p "$WORK"
        cd "$WORK"

        fetch() { # url sha256 outfile
          curl -fsSL --retry 3 -o "$3" "$1"
          echo "$2  $3" | shasum -a 256 -c -
        }
        fetch "$FFMPEG_MAC_ARM64_FFMPEG_URL"   "$FFMPEG_MAC_ARM64_FFMPEG_SHA256"   arm64-ffmpeg.zip
        fetch "$FFMPEG_MAC_ARM64_FFPROBE_URL"  "$FFMPEG_MAC_ARM64_FFPROBE_SHA256"  arm64-ffprobe.zip
        fetch "$FFMPEG_MAC_X86_64_FFMPEG_URL"  "$FFMPEG_MAC_X86_64_FFMPEG_SHA256"  x86_64-ffmpeg.zip
        fetch "$FFMPEG_MAC_X86_64_FFPROBE_URL" "$FFMPEG_MAC_X86_64_FFPROBE_SHA256" x86_64-ffprobe.zip
        fetch "$FFMPEG_LICENSE_URL"            "$FFMPEG_LICENSE_SHA256"            ffmpeg-LICENSE.txt

        for arch in arm64 x86_64; do
          mkdir -p "$arch"
          unzip -o -q "$arch-ffmpeg.zip" -d "$arch"
          unzip -o -q "$arch-ffprobe.zip" -d "$arch"
        done

        for tool in ffmpeg ffprobe; do
          lipo -create arm64/$tool x86_64/$tool -output "$APP/Contents/MacOS/$tool"
          chmod +x "$APP/Contents/MacOS/$tool"
          lipo -info "$APP/Contents/MacOS/$tool"
          lipo "$APP/Contents/MacOS/$tool" -verify_arch arm64 x86_64
        done
        cp ffmpeg-LICENSE.txt "$APP/Contents/Resources/ffmpeg-LICENSE.txt"

        version_out=$("$APP/Contents/MacOS/ffmpeg" -hide_banner -version)
        echo "${version_out%%$'\n'*}"

        cd ${{github.workspace}}
        rm -rf "$WORK"

    - name: Package Universal App with macdeployqt
      run: |
        cd ${{github.workspace}}/build-universal

        # Use macdeployqt to create the DMG with all dependencies
        macdeployqt bin/unabara.app -dmg -verbose=3 -qmldir=${{github.workspace}}/src/ui/qml

        # Rename DMG to include version
        mv bin/unabara.dmg unabara-macos-universal-${{ needs.determine-version.outputs.version }}.dmg

    - name: Upload macOS Universal Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unabara-macos-universal-${{ needs.determine-version.outputs.version }}
        path: ${{github.workspace}}/build-universal/unabara-macos-universal-${{ needs.determine-version.outputs.version }}.dmg

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{github.workspace}}/build-universal/unabara-macos-universal-${{ needs.determine-version.outputs.version }}.dmg
        asset_name: unabara-macos-universal-${{ needs.determine-version.outputs.version }}.dmg
        tag: ${{ github.ref }}
        overwrite: true
